# Полный стек: Postgres → миграции → backend → frontend → nginx.
# HTTP: make -f Makefile.prod up → http://localhost:${NGINX_PORT:-8080}
# HTTPS: make -f Makefile.prod ssl-selfsigned SSL_DOMAIN=… затем make -f Makefile.prod up-https
#   (или положите nginx/ssl/fullchain.pem + privkey.pem сами). Порт HTTPS: NGINX_HTTPS_PORT (по умолчанию 8443).
# basic-auth: make -f Makefile.prod nginx-htpasswd …
# Учётные данные БД: POSTGRES_* (те же значения используют backend и миграции).
# Локальная отладка: make dev-db && make dev-backend && make dev-frontend (см. Makefile + Makefile.local).

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-dashboard-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard-network

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-dashboard-migrations
    environment:
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-dashboard}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        until goose -dir /app/db/migrations postgres \"postgres://$${DB_USER}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${DB_SSLMODE}\" status > /dev/null 2>&1; do
          sleep 1
        done &&
        goose -dir /app/db/migrations postgres \"postgres://$${DB_USER}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${DB_SSLMODE}\" up
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-dashboard-backend
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-123}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - dashboard-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: finance-dashboard-frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    networks:
      - dashboard-network

networks:
  dashboard-network:
    driver: bridge
